name: vesta_tracker
description: "A new Flutter project."
publish_to: 'none' 

version: 1.1.0+4

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_settings: ^5.1.1

  go_router: ^14.0.0 

  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  geolocator: ^13.0.0
  shared_preferences: ^2.3.0
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^11.3.1
  firebase_auth: ^6.4.0
  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  http: ^1.4.0
  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  connectivity_plus: ^7.3.1
  usage_stats: ^2.0.1
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/brand/vesta_logo.png
   - assets/brand/vesta_simbolo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/vesta_simbolo.png"
  adaptive_icon_background: "#F4EDEA"
  adaptive_icon_foreground: "assets/brand/vesta_simbolo.png"
