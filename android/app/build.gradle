plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
// La clave de firma y sus contraseñas viven fuera del proyecto
// (vesta-build/secrets/signing) para que nunca acaben en el repositorio.
// Se puede indicar otra ruta con la variable VESTA_KEY_PROPERTIES.
def keystorePropertiesFile = file(
    System.getenv("VESTA_KEY_PROPERTIES") ?:
        "${rootProject.projectDir}/../../../secrets/signing/key.properties"
)
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.vestaopensource.tracker"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // v1 (JAR) signing as well as v2: Huawei's installer (EMUI/HarmonyOS)
            // rejects v2-only APKs with "did not find any certificates".
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId = "org.vestaopensource.tracker"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    // "web": APK from vestasecurity.date/downloads, updates itself
    //        (src/web: updater, REQUEST_INSTALL_PACKAGES).
    // "play": Google Play, which installs the updates (src/play: no updater).
    // Same applicationId and key; build with --flavor web|play
    // (pubspec.yaml: default-flavor web).
    flavorDimensions = ["store"]
    productFlavors {
        web {
            dimension "store"
            buildConfigField "String", "UPDATE_MANIFEST_URL", '"https://vestasecurity.date/downloads/version.json"'
        }
        play {
            dimension "store"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
